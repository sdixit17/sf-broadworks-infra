# telqon.com: static files from /usr/share/nginx/site, plain HTTP on the server's IP until the domain points here.
# With a domain: add HTTPS (certbot or Caddy) and a 301 from port 80.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    keepalive_timeout 30;
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 512;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /usr/share/nginx/site;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Inline style attributes are used in the page markup; fonts from Google Fonts; scripts are our own files only.
        # The contact form posts to HubSpot's form API when it is configured.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://api.hsforms.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        location / {
            try_files $uri $uri.html $uri/ =404;
        }
        location /assets/ {
            expires 7d;
        }
        location = /sitemap.xml {
            default_type application/xml;
        }
        location = /config.js {
            expires -1;
        }
        error_page 404 /index.html;
    }
}
